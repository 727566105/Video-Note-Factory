<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VideoNote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="VideoNote AI 视频笔记，让音视频看得快、搜得到、用得好。" />
    <title>VideoNote - 强大的AI视频笔记神器</title>
    <script>
      ;(() => {
        try {
          const storedMode = localStorage.getItem('videonote-theme-mode')
          const mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'system' ? storedMode : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolvedMode = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode
          document.documentElement.classList.toggle('dark', resolvedMode === 'dark')
          document.documentElement.style.colorScheme = resolvedMode
        } catch {
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
