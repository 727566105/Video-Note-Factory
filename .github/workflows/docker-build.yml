name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要构建的分支'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - dev
          - dev3.0
      version:
        description: '版本号（如 v1.0.0）'
        required: false
        default: ''
        type: string
      changelog:
        description: '更新内容说明'
        required: false
        default: ''
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine branch and tags
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="main"
          else
            BRANCH="${{ github.event.inputs.branch }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          INPUT_VERSION="${{ github.event.inputs.version }}"
          
          if [ "$BRANCH" = "main" ]; then
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
            if [ -n "$INPUT_VERSION" ]; then
              echo "version_tag=$INPUT_VERSION" >> $GITHUB_OUTPUT
            else
              echo "version_tag=$TIMESTAMP" >> $GITHUB_OUTPUT
            fi
          elif [ "$BRANCH" = "dev3.0" ]; then
            echo "primary_tag=dev3.0" >> $GITHUB_OUTPUT
            if [ -n "$INPUT_VERSION" ]; then
              echo "version_tag=$INPUT_VERSION-dev3.0" >> $GITHUB_OUTPUT
            else
              echo "version_tag=$TIMESTAMP-dev3.0" >> $GITHUB_OUTPUT
            fi
          else
            echo "primary_tag=dev" >> $GITHUB_OUTPUT
            if [ -n "$INPUT_VERSION" ]; then
              echo "version_tag=$INPUT_VERSION-dev" >> $GITHUB_OUTPUT
            else
              echo "version_tag=$TIMESTAMP-dev" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --no-cache \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.primary_tag }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.version_tag }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.primary_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.version_tag }}

      - name: Print build info
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=========================================="
          echo "构建信息:"
          echo "  分支: ${{ steps.determine.outputs.branch }}"
          echo "  镜像标签: ${{ steps.determine.outputs.primary_tag }}"
          echo "  版本标签: ${{ steps.determine.outputs.version_tag }}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "  版本号: ${{ github.event.inputs.version }}"
          fi
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo "  更新内容: ${{ github.event.inputs.changelog }}"
          fi
          echo "=========================================="

      - name: Export Docker image
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.primary_tag }} | gzip > videonote-${{ steps.determine.outputs.version_tag }}.tar.gz
          ls -lh videonote-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videonote-${{ steps.determine.outputs.version_tag }}
          path: videonote-*.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog || format('Release {0}', github.event.inputs.version) }}
          files: videonote-*.tar.gz