name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要构建的分支'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - dev
      version:
        description: '版本号（如 v2.5.3），默认自动递增 0.0.1'
        required: false
        default: ''
        type: string
      changelog:
        description: '更新内容说明（支持多行输入，每行一条更新内容）'
        required: false
        default: ''
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Get last version and calculate new version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            echo "使用手动输入的版本号: $INPUT_VERSION"
            echo "new_version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "自动计算版本号..."
            
            LAST_VERSION=""
            
            if [ "${{ github.event.inputs.branch }}" = "main" ]; then
              LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
            else
              LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev$' | head -1 || echo "")
              if [ -z "$LAST_TAG" ]; then
                LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
              fi
            fi
            
            if [ -n "$LAST_TAG" ]; then
              LAST_VERSION=$(echo "$LAST_TAG" | sed 's/-dev$//' | sed 's/^v//')
              echo "上一个版本: v$LAST_VERSION"
              
              MAJOR=$(echo "$LAST_VERSION" | cut -d. -f1)
              MINOR=$(echo "$LAST_VERSION" | cut -d. -f2)
              PATCH=$(echo "$LAST_VERSION" | cut -d. -f3)
              
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              echo "新版本号: $NEW_VERSION (自动递增 0.0.1)"
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            else
              NEW_VERSION="v1.0.0"
              echo "没有找到历史版本，使用初始版本: $NEW_VERSION"
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine branch and tags
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="main"
          else
            BRANCH="${{ github.event.inputs.branch }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          VERSION="${{ steps.version.outputs.new_version }}"
          
          if [ "$BRANCH" = "main" ]; then
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "primary_tag=dev" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --no-cache \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.primary_tag }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.version_tag }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.primary_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/videonote:${{ steps.determine.outputs.version_tag }}

      - name: Create Git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          BRANCH="${{ steps.determine.outputs.branch }}"
          
          if [ "$BRANCH" = "dev" ]; then
            TAG="${VERSION}-dev"
          else
            TAG="$VERSION"
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Print build info
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=========================================="
          echo "构建信息:"
          echo "  分支: ${{ steps.determine.outputs.branch }}"
          echo "  镜像标签: ${{ steps.determine.outputs.primary_tag }}"
          echo "  版本标签: ${{ steps.determine.outputs.version_tag }}"
          echo "  版本号: ${{ steps.version.outputs.new_version }}"
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo "  更新内容:"
            echo "${{ github.event.inputs.changelog }}" | while IFS= read -r line; do
              echo "    - $line"
            done
          fi
          echo "=========================================="